# FCU bid-scanner — log rotation for the launchd-captured logs.
#
# The four "logging"-based jobs (digest / expirer / jobwalk / supervisor) rotate
# their own <name>.log via a RotatingFileHandler (see bid-scanner/logsetup.py) —
# do NOT list those here or they get double-rotated. This file covers only the
# logs written straight to launchd's StandardOutPath:
#   - scraper.log / parser.log : main.py + parser.py print() output
#   - *.cron.log               : stray print()/tracebacks from the logging jobs
#
# Install:  sudo cp setup/newsyslog/com.fcu.bid-scanner.conf /etc/newsyslog.d/
# Dry run:  sudo newsyslog -nv -f /etc/newsyslog.d/com.fcu.bid-scanner.conf
# Force:    sudo newsyslog -F -f /etc/newsyslog.d/com.fcu.bid-scanner.conf
#
# Columns: logfile [owner:group] mode count size when flags
#   size is KB · when '*' = rotate on size only · J = bzip2 the rotated file

/Users/leo-claude/fcu/bid-scanner/logs/scraper.log         leo-claude:staff 644 5 5120 * J
/Users/leo-claude/fcu/bid-scanner/logs/parser.log          leo-claude:staff 644 5 5120 * J
/Users/leo-claude/fcu/bid-scanner/logs/digest.cron.log     leo-claude:staff 644 3 2048 * J
/Users/leo-claude/fcu/bid-scanner/logs/expirer.cron.log    leo-claude:staff 644 3 2048 * J
/Users/leo-claude/fcu/bid-scanner/logs/jobwalk.cron.log    leo-claude:staff 644 3 2048 * J
/Users/leo-claude/fcu/bid-scanner/logs/supervisor.cron.log leo-claude:staff 644 3 2048 * J
